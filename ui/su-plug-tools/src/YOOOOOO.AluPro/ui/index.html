<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YOOOOO 铝型材工具</title>
  <style>
    :root {
      --bg-color: #1e222b;
      --panel-bg: #252a33;
      --primary-color: #3a86ff;
      --primary-hover: #2667d4;
      --accent-color: #00b4d8;
      --text-main: #e0e6ed;
      --text-muted: #94a3b8;
      --border-color: rgba(255, 255, 255, 0.08);
      --shadow-sm: 0 2px 4px rgba(0, 0, 0, 0.2);
      --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.3);
      --radius-sm: 6px;
      --radius-md: 10px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Microsoft YaHei', sans-serif;
      user-select: none;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Header */
    header {
      padding: 16px 20px;
      background: rgba(30, 34, 43, 0.95);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      backdrop-filter: blur(10px);
      z-index: 10;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 16px;
      letter-spacing: 0.5px;
      background: linear-gradient(135deg, #fff, #a5b4fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand-logo {
      width: 28px;
      height: 28px;
      background: linear-gradient(135deg, var(--primary-color), var(--accent-color));
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 16px;
      box-shadow: 0 2px 8px rgba(58, 134, 255, 0.3);
      -webkit-text-fill-color: white;
    }

    .version {
      font-size: 10px;
      padding: 2px 8px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 12px;
      color: var(--text-muted);
    }

    /* Content Area */
    .content-area {
      flex: 1;
      padding: 16px 20px;
      overflow-y: auto;
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .panel {
      display: block; /* Always visible */
    }

    /* Section Header within content */
    .section-header {
      display: flex;
      align-items: center;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border-color);
    }

    .section-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--accent-color);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Cards & Controls */
    .card {
      background: var(--panel-bg);
      border-radius: var(--radius-md);
      padding: 16px;
      margin-bottom: 16px;
      border: 1px solid var(--border-color);
    }

    .card-title {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text-muted);
      margin-bottom: 12px;
      font-weight: 600;
    }

    .grid-specs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .spec-btn {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid transparent;
      border-radius: var(--radius-sm);
      color: var(--text-muted);
      padding: 10px 0;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .spec-btn:hover {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-main);
    }

    .spec-btn.active {
      background: rgba(58, 134, 255, 0.15);
      border-color: rgba(58, 134, 255, 0.4);
      color: var(--primary-color);
      font-weight: 600;
    }

    .input-group {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 16px;
    }

    .input-wrapper {
      flex: 1;
      position: relative;
      display: flex;
      background: rgba(0, 0, 0, 0.2);
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-color);
      transition: border-color 0.2s;
    }

    .input-wrapper:focus-within {
      border-color: var(--primary-color);
    }

    .input-wrapper input {
      flex: 1;
      background: none;
      border: none;
      color: var(--text-main);
      padding: 10px 12px;
      font-size: 14px;
      outline: none;
      width: 100%;
    }

    .unit-select {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 12px;
      padding: 0 10px;
      border-left: 1px solid var(--border-color);
      outline: none;
      cursor: pointer;
    }

    .unit-select:hover {
      color: var(--text-main);
    }

    /* Buttons */
    .action-btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: var(--radius-sm);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s;
      margin-top: 12px;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--primary-color), #4361ee);
      color: white;
      box-shadow: 0 4px 12px rgba(67, 97, 238, 0.3);
    }

    .btn-primary:hover {
      filter: brightness(1.1);
      transform: translateY(-1px);
    }

    .btn-primary:active {
      transform: translateY(0);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-main);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.12);
    }

    /* Transform Controls */
    .rotate-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .rotate-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 16px 8px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid transparent;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: all 0.2s;
    }

    .rotate-btn:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.1);
    }

    .rotate-btn:active {
      transform: scale(0.98);
    }

    .rotate-icon {
      width: 32px;
      height: 32px;
      opacity: 0.8;
      transition: opacity 0.2s;
    }

    .rotate-btn:hover .rotate-icon {
      opacity: 1;
    }

    .rotate-label {
      font-size: 11px;
      color: var(--text-muted);
    }

    .checkbox-wrapper {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 16px 0;
      cursor: pointer;
    }

    .checkbox-wrapper input[type="checkbox"] {
      appearance: none;
      width: 18px;
      height: 18px;
      border: 2px solid var(--text-muted);
      border-radius: 4px;
      background: transparent;
      cursor: pointer;
      position: relative;
      transition: all 0.2s;
    }

    .checkbox-wrapper input[type="checkbox"]:checked {
      background: var(--primary-color);
      border-color: var(--primary-color);
    }

    .checkbox-wrapper input[type="checkbox"]:checked::after {
      content: '✓';
      position: absolute;
      color: white;
      font-size: 12px;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    .checkbox-label {
      font-size: 13px;
      color: var(--text-main);
    }

    /* Status Bar */
    .status-bar {
      padding: 0 20px;
      height: 36px;
      background: rgba(0, 0, 0, 0.2);
      border-top: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      color: var(--text-muted);
    }

    .status-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 8px rgba(16, 185, 129, 0.4);
    }

    .status-dot.processing {
      background: #f59e0b;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.4); }
      70% { box-shadow: 0 0 0 6px rgba(245, 158, 11, 0); }
      100% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0); }
    }

    /* Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 3px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    /* Update Modal & Badge */
    .update-btn {
      background: rgba(245, 158, 11, 0.15);
      border: 1px solid rgba(245, 158, 11, 0.4);
      color: #f59e0b;
      padding: 6px 12px;
      border-radius: var(--radius-sm);
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      display: none; /* Hidden by default */
      margin-right: 12px;
      transition: all 0.2s;
      letter-spacing: 0.5px;
    }

    .update-btn:hover {
      background: rgba(245, 158, 11, 0.25);
      border-color: #f59e0b;
      transform: translateY(-1px);
    }

    .update-btn::before {
      content: '●';
      margin-right: 6px;
      font-size: 8px;
      animation: pulse-dot 1.5s infinite;
    }

    @keyframes pulse-dot {
      0% { opacity: 0.5; }
      50% { opacity: 1; }
      100% { opacity: 0.5; }
    }

    .modal-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(15, 17, 21, 0.85);
      backdrop-filter: blur(8px);
      display: flex; align-items: center; justify-content: center;
      z-index: 1000;
      opacity: 0; pointer-events: none;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .modal-overlay.active { opacity: 1; pointer-events: auto; }

    .modal-content {
      background: #1e222b;
      padding: 32px;
      border-radius: 16px;
      width: 360px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      text-align: center;
      transform: scale(0.95);
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .modal-overlay.active .modal-content {
      transform: scale(1);
    }

    .modal-title {
      color: var(--text-main);
      margin-bottom: 8px;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .modal-version {
      display: inline-block;
      padding: 4px 10px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 20px;
      color: var(--accent-color);
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 20px;
    }

    .modal-body {
      color: var(--text-muted);
      margin-bottom: 32px;
      font-size: 14px;
      line-height: 1.6;
      text-align: left;
      background: rgba(0, 0, 0, 0.2);
      padding: 16px;
      border-radius: 8px;
    }

    .modal-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .modal-btn {
      padding: 12px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
    }

    .modal-btn.secondary {
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-muted);
    }

    .modal-btn.secondary:hover {
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-main);
    }

    .modal-btn.primary {
      background: var(--primary-color);
      color: white;
      box-shadow: 0 4px 12px rgba(58, 134, 255, 0.3);
    }

    .modal-btn.primary:hover {
      background: var(--primary-hover);
      transform: translateY(-1px);
    }

    .update-progress {
        margin-top: 24px;
        height: 6px;
        background: rgba(255,255,255,0.05);
        border-radius: 3px;
        overflow: hidden;
        display: none;
    }
    .update-bar { height: 100%; background: var(--primary-color); width: 0%; transition: width 0.3s; border-radius: 3px; }
  </style>
</head>

<body>
  <header>
    <div class="brand">
      <div class="brand-logo">Y</div>
      <span>AluPro Tools</span>
    </div>
    <div style="display:flex; align-items:center;">
      <button id="update-btn" class="update-btn">发现新版本</button>
      <div id="local-version" class="version">v--</div>
    </div>
  </header>

  <div class="content-area">
    <!-- Create Panel -->
    <div id="create-panel" class="panel">
      <div class="section-header">
        <div class="section-title">
          <span>📐 型材生成</span>
        </div>
      </div>

      <div class="card">
        <div class="card-title">规格选择</div>
        <div class="grid-specs">
          <button class="spec-btn active" data-size="2020">2020</button>
          <button class="spec-btn" data-size="2040">2040</button>
          <button class="spec-btn" data-size="2060">2060</button>
          <button class="spec-btn" data-size="3030">3030</button>
          <button class="spec-btn" data-size="3060">3060</button>
          <button class="spec-btn" data-size="3090">3090</button>
          <button class="spec-btn" data-size="4040">4040</button>
          <button class="spec-btn" data-size="4080">4080</button>
          <button class="spec-btn" data-size="40120">40120</button>
        </div>
      </div>

      <div class="card">
        <div class="card-title">参数设置</div>
        <div class="input-group">
          <label style="font-size: 13px; color: var(--text-muted);">长度</label>
          <div class="input-wrapper">
            <input type="number" id="length" value="1000" min="10" max="10000" step="10">
            <select id="length-unit" class="unit-select">
              <option value="mm" selected>mm</option>
              <option value="cm">cm</option>
              <option value="m">m</option>
            </select>
          </div>
        </div>
        <button class="action-btn btn-primary" id="create-btn">
          <span>立即创建</span>
        </button>
        <button class="action-btn btn-secondary" id="quick-create-btn">
          <span>快速创建 (默认长度)</span>
        </button>
      </div>
    </div>

    <!-- Transform Panel -->
    <div id="transform-panel" class="panel">
      <div class="card">
        <div class="card-title">空间旋转</div>
        <div class="rotate-grid">
          <button class="rotate-btn" data-direction="front">
            <img src="../icons/rotate1.png" alt="X" class="rotate-icon">
            <span class="rotate-label">前视图(X)</span>
          </button>
          <button class="rotate-btn" data-direction="side">
            <img src="../icons/rotate2.png" alt="Y" class="rotate-icon">
            <span class="rotate-label">侧视图(Y)</span>
          </button>
          <button class="rotate-btn" data-direction="top">
            <img src="../icons/rotate3-2.png" alt="Z" class="rotate-icon">
            <span class="rotate-label">顶视图(Z)</span>
          </button>
        </div>
      </div>

      <div class="card">
        <div class="card-title">智能对齐</div>
        <label class="checkbox-wrapper">
          <input type="checkbox" id="snap-copy">
          <span class="checkbox-label">保留原始对象副本</span>
        </label>
        <button class="action-btn btn-primary" id="align-btn">
          <span>执行吸附对齐</span>
        </button>
      </div>
    </div>
  </div>

  <div class="status-bar">
    <div class="status-left">
      <div class="status-dot" id="status-dot"></div>
      <span id="status-text">系统就绪</span>
    </div>
  </div>

  <!-- Update Modal -->
  <div id="update-modal" class="modal-overlay">
    <div class="modal-content">
      <h3 class="modal-title">发现新版本</h3>
      <div id="modal-version-tag" class="modal-version">v1.0.1</div>

      <div class="modal-body" id="update-desc">
        正在检查更新...
      </div>

      <div class="modal-actions">
        <button class="modal-btn secondary" id="update-cancel-btn">稍后再说</button>
        <button class="modal-btn primary" id="update-confirm-btn">立即更新</button>
      </div>

      <div class="update-progress">
        <div class="update-bar" id="update-bar"></div>
      </div>
    </div>
  </div>

  <script>
    // Update System
    let updateInfo = null;

    // Call Ruby to check update
    function checkUpdate() {
      if(window.sketchup && window.sketchup.check_for_update) {
        window.sketchup.check_for_update();
      } else {
        window.location = 'skp:check_for_update';
      }
    }

    // Callback from Ruby
    window.onUpdateCheckResult = function(result) {
      console.log("Update check result:", result);
      if(!result) return;

      updateInfo = result;

      if (result.force_update) {
        showUpdateModal(true);
      } else if (result.has_update) {
        document.getElementById('update-btn').style.display = 'block';
      }
    };

    window.onUpdateStatus = function(status, isLoading) {
      document.getElementById('status-text').innerText = status;
      if(isLoading) {
        document.querySelector('.update-progress').style.display = 'block';
        document.querySelector('.modal-actions').style.display = 'none'; // Hide buttons during update
        let bar = document.getElementById('update-bar');
        let width = 0;
        let interval = setInterval(() => {
          width += Math.random() * 5;
          if(width > 95) clearInterval(interval);
          bar.style.width = width + '%';
        }, 200);
      } else {
         // document.querySelector('.update-progress').style.display = 'none';
      }
    };

    function showUpdateModal(isForce) {
      const modal = document.getElementById('update-modal');
      const desc = document.getElementById('update-desc');
      const versionTag = document.getElementById('modal-version-tag');
      const cancelBtn = document.getElementById('update-cancel-btn');

      versionTag.innerText = `v${updateInfo.remote_version}`;
      desc.innerHTML = updateInfo.desc || '包含性能优化与稳定性提升。';

      if(isForce) {
        cancelBtn.style.display = 'none';
        document.querySelector('.modal-actions').style.gridTemplateColumns = '1fr';
        desc.innerHTML += '<br><br><span style="color:#ef4444; font-weight:600;">⚠️ 当前版本过旧，必须更新。</span>';
      } else {
        cancelBtn.style.display = 'block';
        document.querySelector('.modal-actions').style.gridTemplateColumns = '1fr 1fr';
      }

      modal.classList.add('active');
    }

    function requestLocalVersion() {
      if(window.sketchup && window.sketchup.get_local_version) {
        window.sketchup.get_local_version();
      } else {
        window.location = 'skp:get_local_version';
      }
    }

    // State
    let state = {
      profileSize: '2020',
      isProcessing: false
    };

    // DOM Elements
    const elements = {
      specBtns: document.querySelectorAll('.spec-btn'),
      statusText: document.getElementById('status-text'),
      statusDot: document.getElementById('status-dot')
    };

    // Initialization
    function init() {
      bindEvents();
      updateStatus(`系统就绪 - 当前规格: ${state.profileSize}`);

      requestLocalVersion();
      setTimeout(checkUpdate, 1000);
    }

    // Event Binding
    function bindEvents() {
      // Update Events
      const updateBtn = document.getElementById('update-btn');
      if(updateBtn) updateBtn.addEventListener('click', () => showUpdateModal(false));

      const cancelBtn = document.getElementById('update-cancel-btn');
      if(cancelBtn) cancelBtn.addEventListener('click', () => {
        document.getElementById('update-modal').classList.remove('active');
      });

      const confirmBtn = document.getElementById('update-confirm-btn');
      if(confirmBtn) confirmBtn.addEventListener('click', () => {
        if(updateInfo && updateInfo.download_url) {
           if(window.sketchup && window.sketchup.perform_update) {
             window.sketchup.perform_update(updateInfo.download_url);
           } else {
             window.location = `skp:perform_update@${updateInfo.download_url}`;
           }
        }
      });

      // Spec Selection
      elements.specBtns.forEach(btn => {
        btn.addEventListener('click', () => {
          elements.specBtns.forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          state.profileSize = btn.dataset.size;
          updateStatus(`已选择 ${state.profileSize} 型材`);
        });
      });

      // Actions
      document.getElementById('create-btn').addEventListener('click', createProfile);
      document.getElementById('quick-create-btn').addEventListener('click', quickCreateProfile);
      document.getElementById('align-btn').addEventListener('click', alignProfiles);

      document.querySelectorAll('.rotate-btn').forEach(btn => {
        btn.addEventListener('click', (e) => rotateProfiles(e.currentTarget.dataset.direction));
      });
    }

    function updateStatus(msg) {
      if (elements.statusText) elements.statusText.textContent = msg;
    }

    function setProcessing(loading) {
      state.isProcessing = loading;
      if (elements.statusDot) {
        elements.statusDot.classList.toggle('processing', loading);
      }
    }

    function callRuby(action, params) {
      if (state.isProcessing) return;
      setProcessing(true);

      try {
        window.location = `skp:${action}@${params}`;
        // Reset status after a delay since we can't get callback from synchronous skp calls easily here
        setTimeout(() => {
          setProcessing(false);
          updateStatus('操作完成');
        }, 1500);
      } catch (e) {
        console.error(e);
        setProcessing(false);
        updateStatus('操作失败');
      }
    }

    // Action Handlers
    function createProfile() {
      const length = document.getElementById('length').value;
      const unit = document.getElementById('length-unit').value;
      updateStatus(`正在创建 ${state.profileSize} 型材...`);
      callRuby('create_profile', `${state.profileSize}|${length}|${unit}`);
    }

    function quickCreateProfile() {
      updateStatus(`快速创建 ${state.profileSize}...`);
      callRuby('quick_create_profile', `${state.profileSize}`);
    }

    function alignProfiles() {
      const snapCopy = document.getElementById('snap-copy').checked;
      updateStatus('正在对齐...');
      callRuby('snap_to_face_tool', `${snapCopy}`);
    }

    function rotateProfiles(direction) {
      updateStatus('正在旋转...');
      callRuby('rotate_tool', `${direction}`);
    }

    // Start
    document.addEventListener('DOMContentLoaded', init);

    window.onLocalVersion = function(version) {
      const el = document.getElementById('local-version');
      if (el) {
        el.textContent = `v${version}`;
      }
    };
  </script>
</body>

</html>
